<style>
     
     #bottom {
        position: absolute;
        width: 1260px;
        height: 950px;
        top: 0px;

    }
   #thumbwrap {
       border: none;
	/*margin:75px auto;*/
      
	/*width:10px; height:10px;*/
}
    
    #invisible {
       position: relative;
        border: none;
        width:30px;
        height:30px;
        float:left;
    }
    
     #visible {
       position: relative;
        border: none;
        width:150px;
        height:150px;
        float:left;
        
    }
.thumb {
	 /* float:left; must be floated for same cross browser position of larger image */
	position:relative;
    border: none;
    
	
}
.thumb img { 
	border: none;
    
    position: relative;
    border-style: none;
	/*vertical-align:bottom;*/
    
}
.thumb:hover {
	border: none; /* IE6 needs this to show large image */
	z-index:1;
}
.thumb span { 
	position:relative;
	visibility:hidden;
    z-index: 5;
   
    
}
.thumb:hover span { 
    position:relative;
	visibility:visible;
	z-index:5;
  
}
    
    a.title:link {

    a.title:hover{

    a.title:visited {

    }
    
    footer{
